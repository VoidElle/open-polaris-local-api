[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-polaris-local-api"
version = "1.2.5"
description = "Async Python library for Tecnosystemi Polaris 5X HVAC Control Unit IoT devices (local TCP, cloud fallback)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=3.4"]
keywords = ["polaris", "hvac", "iot", "asyncio", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/VoidElle/open-polaris-local-api"
Source = "https://github.com/VoidElle/open-polaris-local-api"
"Bug Tracker" = "https://github.com/VoidElle/open-polaris-local-api/issues"

[tool.setuptools]
packages = ["open_polaris_local_api", "open_polaris_local_api.cloud"]
